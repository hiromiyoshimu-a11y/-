name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build_android_apk.yml'
      - 'index.html'
      - 'src/webApp.js'
      - 'src/webApp.css'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'android-apk'
  cancel-in-progress: false

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies & Capacitor Android
        run: |
          npm install
          npm install @capacitor/android@^8.5.3 --save

      - name: Build Web Assets
        run: npm run build

      - name: Add and Sync Capacitor Android Project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap copy android

      - name: Apply Sphere-9 App Icon & App Name for Android
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for dir in android/app/src/main/res/mipmap-*; do
            if [ -d "$dir" ]; then
              cp public/icon-512.png "$dir/ic_launcher.png"
              cp public/icon-512.png "$dir/ic_launcher_round.png"
              cp public/icon-512.png "$dir/ic_launcher_foreground.png"
            fi
          done
          sed -i 's/>EP Papers</>EP \&amp; PFA Papers</g' android/app/src/main/res/values/strings.xml || true

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Copy APK to public/, Rebuild dist, and Commit
        run: |
          git checkout -- package.json package-lock.json || true
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          cp android/app/build/outputs/apk/debug/app-debug.apk public/EP-PFA-Papers.apk
          npm run build
          git add public/EP-PFA-Papers.apk
          git commit -m "build: Generate Android APK (EP-PFA-Papers.apk) [skip ci]" || exit 0
          git push origin main

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EP-PFA-Papers-Android-APK
          path: public/EP-PFA-Papers.apk
          retention-days: 90

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
