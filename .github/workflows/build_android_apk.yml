name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - 'outputs/**'
      - 'ios/**'
      - 'scratch/**'
      - '**/*.md'
      - 'public/papers.json'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-android:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies & Capacitor Android
        run: |
          npm install
          npm install @capacitor/android@^8.5.3 --save

      - name: Build Web Assets
        run: npm run build

      - name: Add and Sync Capacitor Android Project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap copy android

      - name: Apply Sphere-9 App Icon & App Name for Android
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for dir in android/app/src/main/res/mipmap-*; do
            if [ -d "$dir" ]; then
              cp public/icon-512.png "$dir/ic_launcher.png"
              cp public/icon-512.png "$dir/ic_launcher_round.png"
              cp public/icon-512.png "$dir/ic_launcher_foreground.png"
            fi
          done
          sed -i 's/>EP Papers</>EP \&amp; PFA Papers</g' android/app/src/main/res/values/strings.xml || true

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon || ./gradlew assembleDebug --no-daemon

      - name: Prepare APK and Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk EP-PFA-Papers.apk
          gh release create latest-apk EP-PFA-Papers.apk --title "Latest Android APK" --notes "Latest Android APK build." --latest || gh release upload latest-apk EP-PFA-Papers.apk --clobber

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EP-PFA-Papers-Android-APK
          path: EP-PFA-Papers.apk
          retention-days: 90

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retrying Pages deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 15

      - name: Retry Deploy to GitHub Pages
        if: steps.deployment.outcome == 'failure'
        id: deployment_retry
        uses: actions/deploy-pages@v4
