<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>⚡ カテーテル / パルスフィールドアブレーション & 不整脈 最新論文ナビ</title>
  <meta name="description" content="PubMed過去3ヶ月の主要誌(Europace, Heart Rhythm, JACC EP, Circ EP, NEJM, Nat Med等)のカテーテルアブレーション・PFA・不整脈最新論文のAI日本語要約＆全訳アプリ">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <!-- PWA Meta Tags & Manifest -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0F172A">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="icon" type="image/png" href="./icon-192.png">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/webApp.css">
</head>
<body class="dark-theme">
  <div id="app">
    <!-- モバイルヘッダー -->
    <header class="app-header">
      <div class="header-top">
        <div class="brand">
          <span class="icon">⚡</span>
          <div>
            <h1>EP & PFA Papers</h1>
            <p class="sub-title">カテーテル / パルスフィールドアブレーション 最新論文ナビ</p>
          </div>
        </div>
        <div class="header-actions" style="display: flex; gap: 8px; align-items: center;">
          <select id="fontSizeSelect" class="styled-select font-size-select" aria-label="文字サイズ設定" title="文字サイズ変更">
            <option value="small">🔤 小</option>
            <option value="normal" selected>🔤 標準</option>
            <option value="large">🔤 大</option>
            <option value="xlarge">🔤 特大</option>
          </select>
          <button id="pwaInstallBtn" class="action-btn primary" style="display: none; padding: 6px 12px; font-size: 11px; border-radius: 20px;">
            📱 アプリをインストール
          </button>
          <button id="themeToggle" class="icon-btn" aria-label="テーマ切り替え">
            <span class="theme-icon">🌙</span>
          </button>
        </div>
      </div>

      <!-- メタバー -->
      <div class="meta-bar">
        <span class="badge date-badge" id="updatedDateBadge">📅 最終更新: 2026-09-29</span>
        <span class="badge count-badge" id="paperCountBadge">📄 50件の最新論文</span>
        <span class="badge new-count-badge" id="newCountBadge" style="display: none;">✨ 今週の新着: 0件</span>
      </div>

      <!-- 検索・フィルターエリア -->
      <div class="search-container">
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchInput" placeholder="タイトル・キーワード・著者名で検索..." autocomplete="off">
          <button id="clearSearch" class="clear-btn" style="display: none;">✕</button>
        </div>
      </div>

      <!-- フィルタータブ・タブ -->
      <div class="filter-tabs-scroll">
        <button class="tab-btn active" data-filter="all">すべて</button>
        <button class="tab-btn highlight-tab" data-filter="new">✨ 新着論文のみ</button>
        <button class="tab-btn" data-filter="rct">🟢 RCT / 試験</button>
        <button class="tab-btn" data-filter="prospective">🔵 前向き研究</button>
        <button class="tab-btn" data-filter="case">🔴 症例報告</button>
        <button class="tab-btn" data-filter="bookmarks">❤️ ブックマーク</button>
        <button class="tab-btn" data-filter="read" id="readTabBtn">☑ 既読 (0)</button>
      </div>

      <div class="secondary-filters">
        <select id="journalSelect" class="styled-select">
          <option value="all">📚 すべての雑誌</option>
        </select>

        <select id="sortSelect" class="styled-select">
          <option value="priority">🔥 優先順 (RCT/症例数)</option>
          <option value="date">🕒 掲載日順 (新しい順)</option>
          <option value="sampleSize">👥 症例数順 (多い順)</option>
        </select>

        <button id="toggleShowReadBtn" class="styled-toggle-btn" title="既読の論文も一覧に含めて表示します">
          👁️ 既読も表示
        </button>
      </div>
    </header>

    <!-- メイン論文リスト -->
    <main class="main-content">
      <div id="paperList" class="paper-grid">
        <div class="loading-state">
          <div class="spinner"></div>
          <p>最新論文データを読み込んでいます...</p>
        </div>
      </div>
    </main>

    <!-- モバイル用 ボトム詳細スライドインシート / モーダル -->
    <div id="detailModal" class="modal-overlay" style="display: none;">
      <div class="modal-sheet">
        <div class="modal-header">
          <div class="modal-drag-handle"></div>
          <button id="closeModal" class="close-modal-btn">✕</button>
        </div>
        <div class="modal-body" id="modalBody">
          <!-- 詳細内容がここに展開される -->
        </div>
      </div>
    </div>

    <!-- トースト通知 -->
    <div id="toast" class="toast" style="display: none;"></div>
  </div>

  <script type="module" src="/src/webApp.js"></script>
</body>
</html>
